<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NT Quotations — LXX vs Masoretic Text &amp; Apocrypha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,900;1,400;1,600&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #F8F3EA;
  --bg-mt:       #FDFAF4;
  --bg-lxx:      #F5F0E6;
  --bg-nt:       #EFF4EE;
  --bg-ap:       #F4F0F8;
  --sidebar:     #191108;
  --s-text:      #D0B890;
  --s-muted:     #7A6040;
  --s-hover:     #231609;
  --s-active:    #2C1B0C;
  --ink:         #1A1208;
  --muted:       #5C4A30;
  --border:      #D0C3A8;
  --accent:      #7A1F1F;
  --gold:        #AE7B18;
  --c-trans:     #4A5E70;
  --c-major:     #7A1F1F;
  --c-absent:    #5A2D6A;
  --c-textual:   #1A5858;
  --c-targ:      #7A5C1F;
  --c-interp:    #265C26;
  --c-apoc:      #6B3070;
  --font-d: 'Playfair Display', Georgia, serif;
  --font-b: 'Crimson Pro', 'Times New Roman', serif;
  --font-h: 'Frank Ruhl Libre', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-b);
  background: var(--bg);
  color: var(--ink);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 272px;
  min-width: 272px;
  background: var(--sidebar);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid #0D0800;
}

.sidebar-head {
  padding: 18px 16px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.sidebar-label {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--s-muted);
  margin-bottom: 3px;
}

.sidebar-title {
  font-family: var(--font-d);
  font-size: 13.5px;
  color: var(--s-text);
  font-style: italic;
  line-height: 1.35;
}

.sidebar-nav {
  display: flex;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.snav-btn {
  flex: 1;
  padding: 8px 6px;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-family: var(--font-b);
  background: none;
  border: none;
  color: var(--s-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.snav-btn.active {
  color: var(--s-text);
  border-bottom-color: var(--gold);
}
.snav-btn:hover { color: var(--s-text); }

.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
.sidebar-list::-webkit-scrollbar { width: 3px; }
.sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

.p-item {
  padding: 9px 16px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background 0.12s, border-color 0.12s;
}
.p-item:hover  { background: var(--s-hover); }
.p-item.active { background: var(--s-active); border-left-color: var(--gold); }

.p-item-refs {
  font-size: 10px;
  color: var(--s-muted);
  letter-spacing: 0.03em;
  margin-bottom: 2px;
}

.p-item-title {
  font-family: var(--font-d);
  font-size: 13px;
  color: var(--s-text);
  font-style: italic;
  line-height: 1.3;
}

.p-badge {
  display: inline-block;
  margin-top: 4px;
  font-size: 9px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  padding: 2px 5px;
  border-radius: 2px;
}

.back-link {
  display: block;
  padding: 10px 16px;
  font-size: 11px;
  color: var(--s-muted);
  text-decoration: none;
  border-top: 1px solid rgba(255,255,255,0.06);
  letter-spacing: 0.04em;
}
.back-link:hover { color: var(--s-text); }

/* ── MAIN ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.main-head {
  padding: 18px 28px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.main-eyebrow {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}

.main-title {
  font-family: var(--font-d);
  font-size: 24px;
  font-weight: 700;
  line-height: 1.2;
}

.main-refs {
  font-family: var(--font-d);
  font-size: 13px;
  font-style: italic;
  color: var(--accent);
  margin-top: 3px;
}

.main-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px 28px 40px;
}
.main-body::-webkit-scrollbar { width: 5px; }
.main-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── LEGEND ── */
.legend {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  padding: 9px 12px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 3px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
}
.legend-dot { width: 7px; height: 7px; border-radius: 50%; }

/* ── THREE COLUMNS ── */
.columns {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 18px;
}
.columns-two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 18px;
}
.col { padding: 16px 14px; }
.col:not(:last-child) { border-right: 1px solid var(--border); }
.col-mt  { background: var(--bg-mt); }
.col-lxx { background: var(--bg-lxx); }
.col-nt  { background: var(--bg-nt); }
.col-ap  { background: var(--bg-ap); }

.col-head {
  margin-bottom: 12px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--border);
}
.col-lang {
  font-size: 9.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 2px;
}
.col-ref {
  font-family: var(--font-d);
  font-size: 12px;
  font-style: italic;
  color: var(--muted);
}
.col-stripe {
  height: 2px;
  width: 24px;
  margin-top: 7px;
  border-radius: 1px;
}

.t-hebrew {
  font-family: var(--font-h);
  font-size: 20px;
  line-height: 1.9;
  direction: rtl;
  text-align: right;
  margin-bottom: 7px;
}
.t-greek {
  font-family: var(--font-b);
  font-size: 15.5px;
  line-height: 1.7;
  font-style: italic;
  margin-bottom: 7px;
}
.t-translit {
  font-size: 11px;
  color: var(--muted);
  font-style: italic;
  margin-bottom: 7px;
}
.t-english {
  font-size: 14.5px;
  line-height: 1.65;
}

.key-section {
  margin-top: 11px;
  padding-top: 11px;
  border-top: 1px solid var(--border);
}
.key-label {
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 3px;
}
.key-term {
  font-family: var(--font-d);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 2px;
}
.key-meaning {
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
  font-style: italic;
}

.follows-badge {
  display: inline-block;
  font-size: 10.5px;
  padding: 3px 7px;
  border-radius: 2px;
  margin-top: 10px;
}

/* absent column */
.col-absent {
  background: repeating-linear-gradient(
    -45deg,
    transparent, transparent 12px,
    rgba(90,45,106,0.035) 12px, rgba(90,45,106,0.035) 24px
  );
}
.absent-msg {
  padding: 20px 0;
  text-align: center;
  font-family: var(--font-d);
  font-size: 13.5px;
  font-style: italic;
  color: var(--c-absent);
  opacity: 0.75;
}

/* ── DIVERGENCE BOX ── */
.div-box {
  background: white;
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  padding: 12px 16px;
  border-radius: 0 3px 3px 0;
  margin-bottom: 18px;
}
.div-box.apoc { border-left-color: var(--c-apoc); }
.div-label {
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 4px;
}
.div-box.apoc .div-label { color: var(--c-apoc); }
.div-text {
  font-family: var(--font-d);
  font-size: 14px;
  line-height: 1.55;
}

/* ── COMMENTARY ── */
.commentary { margin-bottom: 30px; }
.section-label {
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.commentary-text {
  font-size: 16.5px;
  line-height: 1.78;
  max-width: 70ch;
}

/* ── STRENGTH INDICATOR (apocrypha) ── */
.strength-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
}
.strength-label { font-size: 11px; color: var(--muted); }
.strength-pips { display: flex; gap: 3px; }
.pip {
  width: 18px;
  height: 5px;
  border-radius: 2px;
  background: var(--border);
}
.pip.on { background: var(--c-apoc); }

/* ── BADGE COLORS ── */
.b-translation { background: rgba(74,94,112,.14); color: var(--c-trans); }
.b-substantial { background: rgba(122,31,31,.13); color: var(--c-major); }
.b-absent      { background: rgba(90,45,106,.13); color: var(--c-absent); }
.b-textual     { background: rgba(26,88,88,.12);  color: var(--c-textual); }
.b-targumic    { background: rgba(122,92,31,.13); color: var(--c-targ); }
.b-interpretive{ background: rgba(38,92,38,.12);  color: var(--c-interp); }
.b-apocrypha   { background: rgba(107,48,112,.13);color: var(--c-apoc); }
.b-allusion    { background: rgba(107,48,112,.09);color: var(--c-apoc); }

/* ── ANIMATION ── */
.fade-in { animation: fi 0.2s ease-out; }
@keyframes fi {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── INTRO ── */
.intro-panel { max-width: 640px; padding: 12px 0; }
.intro-heading {
  font-family: var(--font-d);
  font-size: 21px;
  font-weight: 600;
  margin-bottom: 12px;
  line-height: 1.3;
}
.intro-text { font-size: 16.5px; line-height: 1.78; margin-bottom: 12px; }
.intro-tip {
  font-size: 13px;
  color: var(--muted);
  font-style: italic;
  padding: 9px 13px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 3px;
}

/* ── RESPONSIVE ── */
@media (max-width: 860px) {
  body { flex-direction: column; height: auto; overflow: auto; }
  .sidebar { width: 100%; min-width: auto; height: auto; }
  .sidebar-list { overflow-x: auto; display: flex; flex-direction: row; gap: 4px; padding: 5px 6px; }
  .p-item { min-width: 145px; border-left: none; border-bottom: 3px solid transparent; }
  .p-item.active { border-left-color: transparent; border-bottom-color: var(--gold); }
  .main { height: auto; }
  .main-body { overflow: visible; }
  .columns, .columns-two { grid-template-columns: 1fr; }
  .col:not(:last-child) { border-right: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>

<nav class="sidebar" id="sidebar"></nav>

<main class="main">

    <div class="main-title"  id="main-title">Select a passage</div>
    <div class="main-refs"   id="main-refs"></div>
  </div>
  <div class="main-body" id="main-body"></div>
</main>

    ['apocrypha','Direct Quote / Close Parallel'],['allusion','Thematic Allusion']
  ];
  return `<div class="legend">${types.map(([t,l])=>`<div class="legend-item"><div class="legend-dot" style="background:${typeDots[t]}"></div><span>${l}</span></div>`).join('')}</div>`;
}

function buildCanonicalView(p) {
  const color = typeColors[p.type];
  const mtCol = p.mt.absent ? `
    <div class="col col-mt col-absent">
      <div class="col-head">
        <div class="col-lang">Masoretic Text · Hebrew</div>
        <div class="col-ref">${p.otRef}</div>
        ${colStripe('var(--c-textual)')}
      </div>
      <div class="absent-msg">This clause is absent<br>from the Masoretic Text</div>
      <div class="key-section">
        <div class="key-label">Note</div>
        <div class="key-term">${p.mt.keyTerm}</div>
        <div class="key-meaning">${p.mt.keyMeaning}</div>
      </div>
    </div>` : `
    <div class="col col-mt">
      <div class="col-head">
        <div class="col-lang">Masoretic Text · Hebrew</div>
        <div class="col-ref">${p.otRef}</div>
        ${colStripe('var(--c-textual)')}
      </div>
      <div class="t-hebrew">${p.mt.hebrew}</div>
      <div class="t-translit">${p.mt.translit}</div>
      <div class="t-english">${p.mt.english}</div>
      <div class="key-section">
        <div class="key-label">Key Word</div>
        <div class="key-term">${p.mt.keyTerm}</div>
        <div class="key-meaning">${p.mt.keyMeaning}</div>
      </div>
    </div>`;

  return `
    ${buildCanonicalLegend()}
    <div class="div-box">
      <div class="div-label">The Divergence</div>
      <div class="div-text">${p.divergence}</div>
    </div>
    <div class="columns fade-in">
      ${mtCol}
      <div class="col col-lxx">
        <div class="col-head">
          <div class="col-lang">Septuagint · Greek</div>
          <div class="col-ref">${p.otRef}</div>
          ${colStripe(color)}
        </div>
        <div class="t-greek">${p.lxx.greek}</div>
        <div class="t-english">${p.lxx.english}</div>
        <div class="key-section">
          <div class="key-label">Key Word</div>
          <div class="key-term">${p.lxx.keyTerm}</div>
          <div class="key-meaning">${p.lxx.keyMeaning}</div>
        </div>
      </div>
      <div class="col col-nt">
        <div class="col-head">
          <div class="col-lang">New Testament · Greek</div>
          <div class="col-ref">${p.ntRef}</div>
          ${colStripe('var(--c-interp)')}
        </div>
        <div class="t-greek">${p.nt.greek}</div>
        <div class="t-english">${p.nt.english}</div>
        <span class="follows-badge b-${p.type}">${p.nt.follows}</span>
      </div>
    </div>
    <div class="commentary">
      <div class="section-label">Scholarly Commentary</div>
      <div class="commentary-text">${p.commentary}</div>
    </div>`;
}

function buildApocryphalView(p) {
  return `
    ${buildApocLegend()}
    ${strengthPips(p.strength)}
    <div class="div-box apoc">
      <div class="div-label">The Connection</div>
      <div class="div-text">${p.divergence}</div>
    </div>
    <div class="columns-two fade-in">
      <div class="col col-ap">
        <div class="col-head">
          <div class="col-lang">Deuterocanon / Apocrypha</div>
          <div class="col-ref">${p.apoc.source}</div>
          ${colStripe('var(--c-apoc)')}
        </div>
        <div class="t-greek">${p.apoc.greek}</div>
        <div class="t-english">${p.apoc.english}</div>
        <div class="key-section">
          <div class="key-label">Key Term</div>
          <div class="key-term">${p.apoc.keyTerm}</div>
          <div class="key-meaning">${p.apoc.keyMeaning}</div>
        </div>
      </div>
      <div class="col col-nt">
        <div class="col-head">
          <div class="col-lang">New Testament · Greek</div>
          <div class="col-ref">${p.ntRef}</div>
          ${colStripe('var(--c-interp)')}
        </div>
        <div class="t-greek">${p.nt.greek}</div>
        <div class="t-english">${p.nt.english}</div>
        <span class="follows-badge b-apocrypha">${p.nt.follows}</span>
      </div>
    </div>
    <div class="commentary">
      <div class="section-label">Scholarly Commentary</div>
      <div class="commentary-text">${p.commentary}</div>
    </div>`;
}

/* ── SIDEBAR ── */
function buildSidebar() {
  document.getElementById('sidebar').innerHTML = `
    <div class="sidebar-head">
      <div class="sidebar-label">Biblical Studies · Appendix</div>
      <div class="sidebar-title">NT Quotations:<br>LXX &amp; Apocrypha</div>
    </div>
    <div class="sidebar-nav">
      <button class="snav-btn active" id="btn-canon" onclick="switchSection('canonical')">LXX vs MT</button>
      <button class="snav-btn" id="btn-apoc"  onclick="switchSection('apocrypha')">Apocrypha</button>
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
    <a class="back-link" href="/">← Back to Study Modules</a>
  `;
  renderList();
}

function renderList() {
  const list = document.getElementById('sidebar-list');
  const data = currentSection === 'canonical' ? CANONICAL : APOCRYPHA;
  list.innerHTML = '';
  data.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'p-item' + (i === 0 ? ' active' : '');
    div.dataset.id = p.id;
    if (currentSection === 'canonical') {
      div.innerHTML = `
        <div class="p-item-refs">${p.otRef} → ${p.ntRef}</div>
        <div class="p-item-title">${p.title}</div>
        <span class="p-badge b-${p.type}">${p.category}</span>`;
    } else {
      div.innerHTML = `
        <div class="p-item-refs">${p.apocRef} → ${p.ntRef}</div>
        <div class="p-item-title">${p.title}</div>
        <span class="p-badge b-apocrypha">${p.category}</span>`;
    }
    div.addEventListener('click', () => loadPassage(p.id));
    list.appendChild(div);
  });
}

function switchSection(section) {
  currentSection = section;
  document.getElementById('btn-canon').classList.toggle('active', section === 'canonical');
  document.getElementById('btn-apoc').classList.toggle('active', section === 'apocrypha');
  renderList();
  const data = section === 'canonical' ? CANONICAL : APOCRYPHA;
  loadPassage(data[0].id);
}

function loadPassage(id) {
  const data = currentSection === 'canonical' ? CANONICAL : APOCRYPHA;
  const p = data.find(x => x.id === id);
  if (!p) return;

  document.querySelectorAll('.p-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));

  if (currentSection === 'canonical') {
    document.getElementById('main-eyebrow').textContent = `${p.category}  ·  LXX vs Masoretic Text`;
    document.getElementById('main-refs').textContent = `${p.otRef}  ·  ${p.ntRef}`;
    document.getElementById('main-body').innerHTML = buildCanonicalView(p);
  } else {
    document.getElementById('main-eyebrow').textContent = `${p.category}  ·  NT & Deuterocanon`;
    document.getElementById('main-refs').textContent = `${p.apocRef}  ·  ${p.ntRef}`;
    document.getElementById('main-body').innerHTML = buildApocryphalView(p);
  }

  document.getElementById('main-title').textContent = p.title;
  document.getElementById('main-body').scrollTop = 0;
}

buildSidebar();
loadPassage(CANONICAL[0].id);
</script>
</body>
</html>
