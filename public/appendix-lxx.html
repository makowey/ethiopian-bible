<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NT Quotations — LXX, Apocrypha &amp; 1 Enoch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,900;1,400;1,600&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #F8F3EA;
  --bg-mt:       #FDFAF4;
  --bg-lxx:      #F5F0E6;
  --bg-nt:       #EFF4EE;
  --bg-ap:       #F4F0F8;
  --bg-en:       #FBF6EE;
  --sidebar:     #191108;
  --s-text:      #D0B890;
  --s-muted:     #7A6040;
  --s-hover:     #231609;
  --s-active:    #2C1B0C;
  --ink:         #1A1208;
  --muted:       #5C4A30;
  --border:      #D0C3A8;
  --accent:      #7A1F1F;
  --gold:        #AE7B18;
  --c-trans:     #4A5E70;
  --c-major:     #7A1F1F;
  --c-absent:    #5A2D6A;
  --c-textual:   #1A5858;
  --c-targ:      #7A5C1F;
  --c-interp:    #265C26;
  --c-apoc:      #6B3070;
  --c-enoch:     #8B5E14;
  --font-d: 'Playfair Display', Georgia, serif;
  --font-b: 'Crimson Pro', 'Times New Roman', serif;
  --font-h: 'Frank Ruhl Libre', serif;
  --font-ge: 'Noto Serif Ethiopic', 'Noto Sans Ethiopic', 'Ethiopic', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-b);
  background: var(--bg);
  color: var(--ink);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 272px; min-width: 272px;
  background: var(--sidebar);
  display: flex; flex-direction: column;
  overflow: hidden;
  border-right: 1px solid #0D0800;
}
.sidebar-head {
  padding: 18px 16px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.sidebar-label { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--s-muted); margin-bottom: 3px; }
.sidebar-title { font-family: var(--font-d); font-size: 13.5px; color: var(--s-text); font-style: italic; line-height: 1.35; }

.sidebar-nav { display: flex; border-bottom: 1px solid rgba(255,255,255,0.06); }
.snav-btn {
  flex: 1; padding: 7px 4px;
  font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase;
  font-family: var(--font-b);
  background: none; border: none; color: var(--s-muted);
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
}
.snav-btn.active { color: var(--s-text); border-bottom-color: var(--gold); }
.snav-btn:hover { color: var(--s-text); }

.sidebar-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.sidebar-list::-webkit-scrollbar { width: 3px; }
.sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

.p-item {
  padding: 9px 16px; cursor: pointer;
  border-left: 3px solid transparent;
  transition: background .12s, border-color .12s;
}
.p-item:hover  { background: var(--s-hover); }
.p-item.active { background: var(--s-active); border-left-color: var(--gold); }
.p-item-refs { font-size: 10px; color: var(--s-muted); margin-bottom: 2px; }
.p-item-title { font-family: var(--font-d); font-size: 13px; color: var(--s-text); font-style: italic; line-height: 1.3; }
.p-badge { display: inline-block; margin-top: 4px; font-size: 9px; letter-spacing: .09em; text-transform: uppercase; padding: 2px 5px; border-radius: 2px; }

.back-link {
  display: block; padding: 10px 16px;
  font-size: 11px; color: var(--s-muted); text-decoration: none;
  border-top: 1px solid rgba(255,255,255,0.06);
  letter-spacing: .04em;
}
.back-link:hover { color: var(--s-text); }

/* ── MAIN ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.main-head { padding: 18px 28px 12px; border-bottom: 1px solid var(--border); background: var(--bg); }
.main-eyebrow { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.main-title { font-family: var(--font-d); font-size: 24px; font-weight: 700; line-height: 1.2; }
.main-refs { font-family: var(--font-d); font-size: 13px; font-style: italic; color: var(--accent); margin-top: 3px; }

.main-body { flex: 1; overflow-y: auto; padding: 20px 28px 40px; }
.main-body::-webkit-scrollbar { width: 5px; }
.main-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── LEGEND ── */
.legend {
  display: flex; gap: 10px; flex-wrap: wrap;
  margin-bottom: 18px; padding: 9px 12px;
  background: white; border: 1px solid var(--border); border-radius: 3px;
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; }

/* ── COLUMNS ── */
.columns     { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
.columns-two { display: grid; grid-template-columns: 1fr 1fr;     border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }

.col { padding: 16px 14px; }
.col:not(:last-child) { border-right: 1px solid var(--border); }
.col-mt  { background: var(--bg-mt); }
.col-lxx { background: var(--bg-lxx); }
.col-nt  { background: var(--bg-nt); }
.col-ap  { background: var(--bg-ap); }
.col-en  { background: var(--bg-en); }

.col-head { margin-bottom: 12px; padding-bottom: 9px; border-bottom: 1px solid var(--border); }
.col-lang { font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.col-ref  { font-family: var(--font-d); font-size: 12px; font-style: italic; color: var(--muted); }
.col-stripe { height: 2px; width: 24px; margin-top: 7px; border-radius: 1px; }

.t-hebrew  { font-family: var(--font-h); font-size: 20px; line-height: 1.9; direction: rtl; text-align: right; margin-bottom: 7px; }
.t-greek   { font-family: var(--font-b); font-size: 15.5px; line-height: 1.7; font-style: italic; margin-bottom: 7px; }
.t-geez    { font-family: var(--font-ge); font-size: 18px; line-height: 2.1; margin-bottom: 7px; color: var(--ink); }
.t-translit{ font-size: 11px; color: var(--muted); font-style: italic; margin-bottom: 7px; }
.t-english { font-size: 14.5px; line-height: 1.65; }

.key-section { margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--border); }
.key-label  { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.key-term   { font-family: var(--font-d); font-size: 13.5px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
.key-meaning{ font-size: 12px; line-height: 1.5; color: var(--muted); font-style: italic; }

.follows-badge { display: inline-block; font-size: 10.5px; padding: 3px 7px; border-radius: 2px; margin-top: 10px; }

/* absent column */
.col-absent {
  background: repeating-linear-gradient(-45deg, transparent, transparent 12px, rgba(90,45,106,0.035) 12px, rgba(90,45,106,0.035) 24px);
}
.absent-msg { padding: 20px 0; text-align: center; font-family: var(--font-d); font-size: 13.5px; font-style: italic; color: var(--c-absent); opacity: .75; }

/* Ethiopian canon callout */
.eth-canon {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; padding: 4px 9px; border-radius: 2px;
  background: rgba(139,94,20,.1); color: var(--c-enoch);
  margin-bottom: 10px; font-family: var(--font-b);
}

/* ── DIVERGENCE BOX ── */
.div-box {
  background: white; border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  padding: 12px 16px; border-radius: 0 3px 3px 0; margin-bottom: 18px;
}
.div-box.apoc  { border-left-color: var(--c-apoc); }
.div-box.enoch { border-left-color: var(--c-enoch); }
.div-label { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.div-box.apoc  .div-label { color: var(--c-apoc); }
.div-box.enoch .div-label { color: var(--c-enoch); }
.div-text { font-family: var(--font-d); font-size: 14px; line-height: 1.55; }

/* ── COMMENTARY ── */
.commentary { margin-bottom: 30px; }
.section-label { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.commentary-text { font-size: 16.5px; line-height: 1.78; max-width: 70ch; }

/* ── STRENGTH PIPS ── */
.strength-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
.strength-label { font-size: 11px; color: var(--muted); }
.strength-pips  { display: flex; gap: 3px; }
.pip { width: 18px; height: 5px; border-radius: 2px; background: var(--border); }
.pip.on-apoc  { background: var(--c-apoc); }
.pip.on-enoch { background: var(--c-enoch); }

/* ── BADGE COLORS ── */
.b-translation  { background: rgba(74,94,112,.14);  color: var(--c-trans); }
.b-substantial  { background: rgba(122,31,31,.13);  color: var(--c-major); }
.b-absent       { background: rgba(90,45,106,.13);  color: var(--c-absent); }
.b-textual      { background: rgba(26,88,88,.12);   color: var(--c-textual); }
.b-targumic     { background: rgba(122,92,31,.13);  color: var(--c-targ); }
.b-interpretive { background: rgba(38,92,38,.12);   color: var(--c-interp); }
.b-apocrypha    { background: rgba(107,48,112,.13); color: var(--c-apoc); }
.b-allusion     { background: rgba(107,48,112,.09); color: var(--c-apoc); }
.b-enoch        { background: rgba(139,94,20,.14);  color: var(--c-enoch); }
.b-enoch-lost   { background: rgba(139,94,20,.09);  color: var(--c-enoch); }

/* ── ANIMATION ── */
.fade-in { animation: fi .2s ease-out; }
@keyframes fi { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

/* ── INTRO ── */
.intro-panel { max-width: 640px; padding: 12px 0; }
.intro-heading { font-family: var(--font-d); font-size: 21px; font-weight: 600; margin-bottom: 12px; line-height: 1.3; }
.intro-text { font-size: 16.5px; line-height: 1.78; margin-bottom: 12px; }
.intro-tip { font-size: 13px; color: var(--muted); font-style: italic; padding: 9px 13px; background: white; border: 1px solid var(--border); border-radius: 3px; }

/* ── RESPONSIVE ── */
@media (max-width: 860px) {
  body { flex-direction: column; height: auto; overflow: auto; }
  .sidebar { width: 100%; min-width: auto; height: auto; }
  .sidebar-list { overflow-x: auto; display: flex; flex-direction: row; gap: 4px; padding: 5px 6px; }
  .p-item { min-width: 145px; border-left: none; border-bottom: 3px solid transparent; }
  .p-item.active { border-left-color: transparent; border-bottom-color: var(--gold); }
  .main { height: auto; } .main-body { overflow: visible; }
  .columns, .columns-two { grid-template-columns: 1fr; }
  .col:not(:last-child) { border-right: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>

<main class="main">
  <div class="main-head" id="main-head">

    <div class="main-refs"   id="main-refs"></div>
  </div>
  <div class="main-body" id="main-body"></div>
</main>
<script>

const CANONICAL = [
  {
    id:'isa-7-14', otRef:'Isaiah 7:14', ntRef:'Matthew 1:23',
    category:'Translation Divergence', type:'translation',
    title:'Virgin or Young Woman?',
    divergence:'The NT depends entirely on the LXX\'s "virgin" (παρθένος); the MT\'s Hebrew word ʿalmah simply means "young woman."',
    mt:{ hebrew:'הִנֵּה הָעַלְמָה הָרָה וְיֹלֶדֶת בֵּן', translit:'hinneh ha-ʿalmah harah we-yoledet ben',
      english:'Behold, the young woman is pregnant and bearing a son',
      keyTerm:'עַלְמָה (ʿalmah)', keyMeaning:'"Young woman" of marriageable age; no inherent implication of virginity' },
    lxx:{ greek:'ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν',
      english:'Behold, the virgin will conceive in the womb and bear a son',
      keyTerm:'παρθένος (parthenos)', keyMeaning:'"Virgin" — the LXX translators chose this far more specific term' },
    nt:{ greek:'ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν',
      english:'Behold, the virgin will conceive and bear a son', reference:'Matthew 1:23', follows:'LXX verbatim' },
    commentary:'The Hebrew עַלְמָה (ʿalmah) occurs nine times in the OT and refers to a young woman of marriageable age, without any necessary implication of virginity (the specific Hebrew term for "virgin" is בְּתוּלָה, betulah). The LXX translators chose παρθένος (parthenos), which explicitly denotes a virgin. Matthew\'s entire birth narrative rests on this LXX reading: both the angel\'s announcement and the evangelist\'s editorial comment depend on the word "virgin." This is arguably the single most consequential LXX/MT divergence in all of New Testament theology.'
  },
  {
    id:'ps-40-6', otRef:'Psalm 40:6 (LXX 39:7)', ntRef:'Hebrews 10:5',
    category:'Substantial Difference', type:'substantial',
    title:'Body or Ears?',
    divergence:'Hebrews 10:5–10 builds its entire incarnational argument on "a body you prepared for me" — a reading wholly absent from the MT.',
    mt:{ hebrew:'אָזְנַיִם כָּרִיתָ לִּי', translit:'oznayim karita li',
      english:'Ears you have dug / opened for me',
      keyTerm:'אָזְנַיִם (oznayim)', keyMeaning:'"Ears" — possibly an idiom for receptive obedience; cf. the ear-piercing rite of Ex 21:6' },
    lxx:{ greek:'σῶμα δὲ κατηρτίσω μοι', english:'But a body you have prepared for me',
      keyTerm:'σῶμα (sōma)', keyMeaning:'"Body" — a radical departure; may reflect a different Hebrew Vorlage or interpretive expansion' },
    nt:{ greek:'σῶμα δὲ κατηρτίσω μοι', english:'A body you have prepared for me',
      reference:'Hebrews 10:5', follows:'LXX verbatim' },
    commentary:'The MT\'s "ears you have dug/opened" is likely an idiom meaning "you have given me attentive, obedient hearing." The LXX\'s "a body you have prepared for me" is a substantial departure. The author of Hebrews quotes this LXX reading and explicitly interprets it: Christ\'s words at the Incarnation ("a body you prepared for me") mean that the offering of his physical body abolishes the animal sacrificial system. The entire christological argument of Hebrews 10:5–10 would be impossible from the MT alone.'
  },
  {
    id:'amos-9-12', otRef:'Amos 9:11–12', ntRef:'Acts 15:17',
    category:'Absent from MT', type:'absent',
    title:'Edom or the Gentiles?',
    divergence:'The MT envisions Israel conquering Edom; the LXX transforms this into all Gentiles seeking the Lord — the theological basis for the Jerusalem Council\'s ruling.',
    mt:{ hebrew:'לְמַעַן יִירְשׁוּ אֶת-שְׁאֵרִית אֱדוֹם', translit:'lemaʿan yireshu et-sheʾerit edom',
      english:'So that they may possess the remnant of Edom and all the nations called by my name',
      keyTerm:'אֱדוֹם (Edom) + יִירְשׁוּ (possess)', keyMeaning:'National restoration: Israel will conquer Edom\'s remnant' },
    lxx:{ greek:'ὅπως ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη',
      english:'So that the remnant of mankind may seek the Lord, even all the Gentiles upon whom my name is called',
      keyTerm:'ἄνθρωποι / ἔθνη', keyMeaning:'אדם (man) read instead of אדום (Edom); "possess" → "seek"' },
    nt:{ greek:'ὅπως ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον',
      english:'So that the remnant of mankind may seek the Lord, and all the Gentiles', reference:'Acts 15:17', follows:'LXX; fundamentally different meaning from MT' },
    commentary:'James\'s entire scriptural argument at the Jerusalem Council rests on this LXX rendering. The MT\'s prophecy is nationalistic: Israel will possess and dominate Edom\'s remnant. The LXX transformation results from: (1) consonants אדם (man) read instead of אדום (Edom); (2) יִירְשׁוּ (possess) becoming ἐκζητήσωσιν (seek). The LXX\'s universalist text became a charter for Gentile mission. Without it, the Jerusalem Council\'s foundational proof-text disappears from the OT entirely.'
  },
  {
    id:'gen-47-31', otRef:'Genesis 47:31', ntRef:'Hebrews 11:21',
    category:'Orthographic Variant', type:'textual',
    title:'Staff or Bed?',
    divergence:'Identical Hebrew consonants מטה were vocalized as "bed" (MT) vs "staff" (LXX) — a difference of vowel-pointing alone.',
    mt:{ hebrew:'וַיִּשְׁתַּחוּ יִשְׂרָאֵל עַל-רֹאשׁ הַמִּטָּה', translit:'wayyishtaḥu yisraʾel ʿal-roʾsh ha-mittah',
      english:'And Israel bowed in worship at the head of the bed',
      keyTerm:'מִּטָּה (mittah)', keyMeaning:'"Bed" — the Masoretes vocalized the consonants מטה as mittah' },
    lxx:{ greek:'καὶ προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ',
      english:'And Israel worshiped toward the top of his staff',
      keyTerm:'ῥάβδος (rhabdos)', keyMeaning:'"Staff" — same consonants מטה read as matteh (rod/staff)' },
    nt:{ greek:'προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ',
      english:'He worshiped leaning on the top of his staff', reference:'Hebrews 11:21', follows:'LXX exactly' },
    commentary:'Ancient Hebrew was written without vowels. The consonants מטה can be read as מִטָּה (mittah, "bed") or מַטֶּה (matteh, "rod/staff"). The Masoretes vocalized it "bed"; the LXX translators read "staff" — evoking the patriarch\'s shepherd crook. Hebrews 11:21 quotes the LXX verbatim as an example of faith. The "staff" reading may reflect a genuinely older tradition and resonates with the Joseph narrative\'s rod imagery.'
  },
  {
    id:'eph-4-8', otRef:'Psalm 68:18', ntRef:'Ephesians 4:8',
    category:'Targumic Reading', type:'targumic',
    title:'Gave or Received Gifts?',
    divergence:'Ephesians reverses the direction of gift-giving — differing from both MT and LXX, likely following Aramaic targumic tradition.',
    mt:{ hebrew:'לָקַחְתָּ מַתָּנוֹת בָּאָדָם', translit:'laqaḥta mattanot ba-adam',

      keyTerm:'לָקַחְתָּ (laqaḥta)', keyMeaning:'"You received" — God / the victorious king receiving tribute after ascending' },
    lxx:{ greek:'ἔλαβες δόματα ἐν ἀνθρώπῳ', english:'You received gifts among men',
      keyTerm:'ἔλαβες (elabes)', keyMeaning:'"You received" — LXX closely follows MT; both have "received"' },
    nt:{ greek:'ἔδωκεν δόματα τοῖς ἀνθρώποις', english:'He gave gifts to men',
      reference:'Ephesians 4:8', follows:'Neither MT nor LXX — follows Aramaic Targum tradition' },
    commentary:'Ephesians 4:8 differs from both MT and LXX, which both read "received." The Aramaic Targum on the Psalms reads "gave gifts to men," interpreted as Moses ascending Sinai to receive the Torah then distributing it to Israel. Paul inverts the direction of gift-giving: Christ the ascended conqueror distributes spiritual gifts to the church. The theological move from "received" to "gave" is the argument itself.'
  },
  {
    id:'isa-28-16', otRef:'Isaiah 28:16', ntRef:'Romans 9:33 / 1 Peter 2:6',
    category:'LXX Intensification', type:'translation',
    title:'"Never" Put to Shame',
    divergence:'The MT uses a military metaphor ("will not flee"); the LXX shifts to shame/honor language adopted wholesale by Romans and 1 Peter.',
    mt:{ hebrew:'לֹא יָחִישׁ', translit:'lo yaḥish', english:'Will not hurry away / will not flee in panic',
      keyTerm:'יָחִישׁ (yaḥish)', keyMeaning:'"Hasten/hurry" — a military image: the faithful need not flee in rout' },
    lxx:{ greek:'ὁ πιστεύων ἐπ᾽ αὐτῷ οὐ μὴ καταισχυνθῇ', english:'The one who believes in him will by no means be put to shame',

    nt:{ greek:'ὁ πιστεύων ἐπ᾽ αὐτῷ οὐ καταισχυνθήσεται',
      english:'The one who believes in him will not be put to shame',
      reference:'Romans 9:33; 1 Peter 2:6', follows:'LXX; shame/honor framework fits Greco-Roman context' },
    commentary:'The MT\'s prophecy operates in the register of military security: the one who trusts will not need to flee when crisis comes. The LXX shifts the metaphor into the honor-shame domain, which was the primary social currency of the Greco-Roman world. Both Paul in Romans and Peter in his first letter cite the LXX text, building soteriological arguments using shame-and-honor language deeply resonant for their audiences.'
  },
  {
    id:'deut-32-43', otRef:'Deuteronomy 32:43', ntRef:'Hebrews 1:6',
    category:'Absent from MT', type:'absent',
    title:'"Let All Angels Worship Him"',

/* ═══════════════════════════════════════════════════════════
   RENDERING
═══════════════════════════════════════════════════════════ */
let currentSection = 'canonical';

const typeColors = {
  translation:'var(--c-trans)', substantial:'var(--c-major)', absent:'var(--c-absent)',
  textual:'var(--c-textual)', targumic:'var(--c-targ)', interpretive:'var(--c-interp)',
  apocrypha:'var(--c-apoc)', allusion:'var(--c-apoc)',
  enoch:'var(--c-enoch)', 'enoch-lost':'var(--c-enoch)'
};
const typeDots = {
  translation:'#4A5E70', substantial:'#7A1F1F', absent:'#5A2D6A',
  textual:'#1A5858', targumic:'#7A5C1F', interpretive:'#265C26',
  apocrypha:'#6B3070', allusion:'#9B60A0',
  enoch:'#8B5E14', 'enoch-lost':'#A07830'
};

function colStripe(color) {
  return `<div class="col-stripe" style="background:${color}"></div>`;
}

function strengthPips(n, cls) {
  let html = `<div class="strength-bar"><span class="strength-label">Scholarly confidence:</span><div class="strength-pips">`;
  for (let i = 1; i <= 5; i++) html += `<div class="pip${i <= n ? ' '+cls : ''}"></div>`;
  return html + '</div></div>';
}

function buildCanonicalLegend() {
  const types = [
    ['translation','Translation Divergence'],['substantial','Substantial Difference'],
    ['absent','Absent from MT'],['textual','Orthographic Variant'],
    ['targumic','Targumic / Midrashic'],['interpretive','Interpretive Addition']
  ];
  return `<div class="legend">${types.map(([t,l])=>`<div class="legend-item"><div class="legend-dot" style="background:${typeDots[t]}"></div><span>${l}</span></div>`).join('')}</div>`;
}
function buildApocLegend() {
  return `<div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:${typeDots.apocrypha}"></div><span>Close Parallel / Direct Quote</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:${typeDots.allusion}"></div><span>Thematic Allusion</span></div>
  </div>`;
}
function buildEnochLegend() {
  return `<div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:${typeDots.enoch}"></div><span>1 Enoch / Pseudepigrapha</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:${typeDots['enoch-lost']}"></div><span>Lost Source (patristic evidence)</span></div>
    <div class="legend-item" style="font-size:10px;color:var(--muted);font-style:italic">Ge'ez text = Ethiopian canon</div>
  </div>`;
}

function buildCanonicalView(p) {
  const color = typeColors[p.type];
  const mtCol = p.mt.absent ? `
    <div class="col col-mt col-absent">
      <div class="col-head"><div class="col-lang">Masoretic Text · Hebrew</div><div class="col-ref">${p.otRef}</div>${colStripe('var(--c-textual)')}</div>
      <div class="absent-msg">This clause is absent<br>from the Masoretic Text</div>
      <div class="key-section"><div class="key-label">Note</div><div class="key-term">${p.mt.keyTerm}</div><div class="key-meaning">${p.mt.keyMeaning}</div></div>
    </div>` : `
    <div class="col col-mt">
      <div class="col-head"><div class="col-lang">Masoretic Text · Hebrew</div><div class="col-ref">${p.otRef}</div>${colStripe('var(--c-textual)')}</div>
      <div class="t-hebrew">${p.mt.hebrew}</div>
      <div class="t-translit">${p.mt.translit}</div>
      <div class="t-english">${p.mt.english}</div>
      <div class="key-section"><div class="key-label">Key Word</div><div class="key-term">${p.mt.keyTerm}</div><div class="key-meaning">${p.mt.keyMeaning}</div></div>
    </div>`;

  return `
    ${buildCanonicalLegend()}
    <div class="div-box"><div class="div-label">The Divergence</div><div class="div-text">${p.divergence}</div></div>
    <div class="columns fade-in">
      ${mtCol}
      <div class="col col-lxx">
        <div class="col-head"><div class="col-lang">Septuagint · Greek</div><div class="col-ref">${p.otRef}</div>${colStripe(color)}</div>
        <div class="t-greek">${p.lxx.greek}</div>
        <div class="t-english">${p.lxx.english}</div>
        <div class="key-section"><div class="key-label">Key Word</div><div class="key-term">${p.lxx.keyTerm}</div><div class="key-meaning">${p.lxx.keyMeaning}</div></div>
      </div>
      <div class="col col-nt">
        <div class="col-head"><div class="col-lang">New Testament · Greek</div><div class="col-ref">${p.ntRef}</div>${colStripe('var(--c-interp)')}</div>
        <div class="t-greek">${p.nt.greek}</div>
        <div class="t-english">${p.nt.english}</div>
        <span class="follows-badge b-${p.type}">${p.nt.follows}</span>
      </div>
    </div>
    <div class="commentary"><div class="section-label">Scholarly Commentary</div><div class="commentary-text">${p.commentary}</div></div>`;
}

function buildApocryphalView(p) {
  return `
    ${buildApocLegend()}
    ${strengthPips(p.strength,'on-apoc')}
    <div class="div-box apoc"><div class="div-label">The Connection</div><div class="div-text">${p.divergence}</div></div>
    <div class="columns-two fade-in">
      <div class="col col-ap">
        <div class="col-head"><div class="col-lang">Deuterocanon / Apocrypha</div><div class="col-ref">${p.apoc.source}</div>${colStripe('var(--c-apoc)')}</div>
        <div class="t-greek">${p.apoc.greek}</div>
        <div class="t-english">${p.apoc.english}</div>
        <div class="key-section"><div class="key-label">Key Term</div><div class="key-term">${p.apoc.keyTerm}</div><div class="key-meaning">${p.apoc.keyMeaning}</div></div>
      </div>
      <div class="col col-nt">
        <div class="col-head"><div class="col-lang">New Testament · Greek</div><div class="col-ref">${p.ntRef}</div>${colStripe('var(--c-interp)')}</div>
        <div class="t-greek">${p.nt.greek}</div>
        <div class="t-english">${p.nt.english}</div>
        <span class="follows-badge b-apocrypha">${p.nt.follows}</span>
      </div>
    </div>
    <div class="commentary"><div class="section-label">Scholarly Commentary</div><div class="commentary-text">${p.commentary}</div></div>`;
}

function buildEnochView(p) {
  const isLost = p.enoch.geez.startsWith('[Text lost') || p.enoch.geez.startsWith('[Parables');
  return `
    ${buildEnochLegend()}
    ${strengthPips(p.strength,'on-enoch')}
    <div class="div-box enoch"><div class="div-label">The Connection</div><div class="div-text">${p.divergence}</div></div>
    <div class="columns-two fade-in">
      <div class="col col-en">
        <div class="col-head"><div class="col-lang">${p.source}</div><div class="col-ref">${p.enochRef}</div>${colStripe('var(--c-enoch)')}</div>
        ${isLost
          ? `<div class="absent-msg" style="color:var(--c-enoch)">${p.enoch.geez.replace('[','').replace(']','')}</div>`
          : `<div class="t-geez">${p.enoch.geez}</div>`
        }
        ${!isLost && p.enoch.greek && !p.enoch.greek.startsWith('[') ? `<div class="t-greek">${p.enoch.greek}</div>` : ''}
        ${p.enoch.greek && p.enoch.greek.startsWith('[') && !isLost ? `<div class="t-translit">${p.enoch.greek}</div>` : ''}
        <div class="t-english">${p.enoch.english}</div>
        <div class="key-section"><div class="key-label">Key Term</div><div class="key-term">${p.enoch.keyTerm}</div><div class="key-meaning">${p.enoch.keyMeaning}</div></div>
      </div>
      <div class="col col-nt">
        <div class="col-head"><div class="col-lang">New Testament · Greek</div><div class="col-ref">${p.ntRef}</div>${colStripe('var(--c-interp)')}</div>
        <div class="t-greek">${p.nt.greek}</div>
        <div class="t-english">${p.nt.english}</div>
        <span class="follows-badge b-enoch">${p.nt.follows}</span>
      </div>
    </div>
    <div class="commentary"><div class="section-label">Scholarly Commentary</div><div class="commentary-text">${p.commentary}</div></div>`;
}

    <div class="sidebar-head">
      <div class="sidebar-label">Biblical Studies · Appendix</div>
      <div class="sidebar-title">NT Quotations:<br>LXX · Apocrypha · 1 Enoch</div>
    </div>
    <div class="sidebar-nav">
      <button class="snav-btn active" id="btn-canon" onclick="switchSection('canonical')">LXX vs MT</button>
      <button class="snav-btn" id="btn-apoc"  onclick="switchSection('apocrypha')">Apocrypha</button>
      <button class="snav-btn" id="btn-enoch" onclick="switchSection('enoch')">1 Enoch</button>
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
    <a class="back-link" href="/">← Back to Study Modules</a>
  `;
  renderList();
}

function renderList() {
  const list = document.getElementById('sidebar-list');
  let data, labelFn;
  if (currentSection === 'canonical') {
    data = CANONICAL;
    labelFn = p => ({ refs: `${p.otRef} → ${p.ntRef}`, title: p.title, badge: `b-${p.type}`, cat: p.category });
  } else if (currentSection === 'apocrypha') {
    data = APOCRYPHA;
    labelFn = p => ({ refs: `${p.apocRef} → ${p.ntRef}`, title: p.title, badge: `b-${p.type}`, cat: p.category });
  } else {
    data = ENOCH;
    labelFn = p => ({ refs: `${p.enochRef} → ${p.ntRef}`, title: p.title, badge: 'b-enoch', cat: p.category });
  }
  list.innerHTML = '';
  data.forEach((p, i) => {
    const { refs, title, badge, cat } = labelFn(p);
    const div = document.createElement('div');
    div.className = 'p-item' + (i === 0 ? ' active' : '');
    div.dataset.id = p.id;
    div.innerHTML = `<div class="p-item-refs">${refs}</div><div class="p-item-title">${title}</div><span class="p-badge ${badge}">${cat}</span>`;
    div.addEventListener('click', () => loadPassage(p.id));
    list.appendChild(div);
  });
}

function switchSection(section) {
  currentSection = section;
  ['canon','apoc','enoch'].forEach(k => document.getElementById('btn-'+k).classList.remove('active'));
  const map = {canonical:'canon', apocrypha:'apoc', enoch:'enoch'};
  document.getElementById('btn-'+map[section]).classList.add('active');
  renderList();
  const data = section === 'canonical' ? CANONICAL : section === 'apocrypha' ? APOCRYPHA : ENOCH;
  loadPassage(data[0].id);
}

function loadPassage(id) {
  const allData = [...CANONICAL, ...APOCRYPHA, ...ENOCH];
  const p = allData.find(x => x.id === id);
  if (!p) return;

  document.querySelectorAll('.p-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));

  if (currentSection === 'canonical') {
    document.getElementById('main-eyebrow').textContent = `${p.category}  ·  LXX vs Masoretic Text`;
    document.getElementById('main-refs').textContent    = `${p.otRef}  ·  ${p.ntRef}`;
    document.getElementById('main-body').innerHTML = buildCanonicalView(p);
  } else if (currentSection === 'apocrypha') {
    document.getElementById('main-eyebrow').textContent = `${p.category}  ·  NT & Deuterocanon`;
    document.getElementById('main-refs').textContent    = `${p.apocRef}  ·  ${p.ntRef}`;
    document.getElementById('main-body').innerHTML = buildApocryphalView(p);
  } else {
    document.getElementById('main-eyebrow').textContent = `${p.category}  ·  NT & ${p.source}`;
    document.getElementById('main-refs').textContent    = `${p.enochRef}  ·  ${p.ntRef}`;
    document.getElementById('main-body').innerHTML = buildEnochView(p);
  }

  document.getElementById('main-title').textContent = p.title;
  document.getElementById('main-body').scrollTop = 0;
}

buildSidebar();
loadPassage(CANONICAL[0].id);
</script>
</body>
</html>
